workflows:
  rcs_vault_android:
    name: RCS Vault Android APK
    max_build_duration: 60

    environment:
      android_signing:
        - paliaapk-release

      java: 17

      vars:
        PACKAGE_NAME: com.aistudio.rcsbackup.zqmvxp

    scripts:

      - name: Prepare Gradle wrapper
        script: |
          set -e

          echo "Project:"
          pwd

          echo "Gradle wrapper files:"
          ls -la gradle/wrapper/

          # Force Gradle 9.3.1
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=100000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "Wrapper Gradle version:"
          ./gradlew --version

      - name: Check signing
        script: |
          set -e

          echo "Checking Codemagic signing..."

          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"

          echo "Signing configuration OK."
          echo "Alias: $CM_KEY_ALIAS"

      - name: Clean project
        script: |
          set -e

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            clean

      - name: Build signed release APK
        script: |
          set -e

          echo "Building RCS Vault APK..."

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            assembleRelease

          echo "APK files:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Verify and rename APK
        script: |
          set -e

          APK_DIR="app/build/outputs/apk/release"
          APK="$APK_DIR/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: app-release.apk was not generated."
            find app/build/outputs -type f -print
            exit 1
          fi

          cp "$APK" "$APK_DIR/RCS-Vault.apk"

          echo "Final APK:"
          ls -lh "$APK_DIR/RCS-Vault.apk"

    artifacts:
      - app/build/outputs/apk/release/RCS-Vault.apk

    publishing:
      scripts:
        - name: Build success
          script: |
            echo "RCS Vault APK is ready."
