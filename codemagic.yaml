workflows:
  rcs_vault_android:
    name: RCS Vault Android APK
    max_build_duration: 60

    environment:
      android_signing:
        - paliaapk-release

      java: 17

      vars:
        PACKAGE_NAME: com.aistudio.rcsbackup.zqmvxp

    scripts:
      - name: Check project
        script: |
          set -e

          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Checking Android project:"
          test -d ./app
          test -f ./app/build.gradle.kts
          test -f ./settings.gradle.kts
          test -f ./build.gradle.kts

          echo "Android project found successfully."

      - name: Check signing
        script: |
          set -e

          echo "Checking Android signing..."

          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"

          echo "Keystore configured successfully."
          echo "Alias: $CM_KEY_ALIAS"

      - name: Build signed release APK
        script: |
          set -e

          echo "Starting RCS Vault release build..."

          gradle --no-daemon clean assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/mapping.txt
