workflows:
  rcs_vault_android:
    name: RCS Vault Android APK
    max_build_duration: 60

    environment:
      android_signing:
        - paliaapk-release

      java: 17

      vars:
        PACKAGE_NAME: com.aistudio.rcsbackup.zqmvxp

    scripts:

      - name: Install Gradle 9.3.1
        script: |
          set -e

          echo "Installing Gradle 9.3.1..."

          mkdir -p "$HOME/gradle-9.3.1"

          curl -L \
            --fail \
            --retry 3 \
            -o "$HOME/gradle-9.3.1.zip" \
            "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"

          unzip -q -o "$HOME/gradle-9.3.1.zip" -d "$HOME"

          export GRADLE_HOME="$HOME/gradle-9.3.1"
          export PATH="$GRADLE_HOME/bin:$PATH"

          echo "Installed Gradle:"
          "$GRADLE_HOME/bin/gradle" --version

      - name: Check Android project
        script: |
          set -e

          test -d app
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          test -f build.gradle.kts

          echo "Android project detected."

      - name: Check signing
        script: |
          set -e

          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"

          echo "Signing configuration OK."
          echo "Alias: $CM_KEY_ALIAS"

      - name: Clean project
        script: |
          set -e

          export GRADLE_HOME="$HOME/gradle-9.3.1"
          export PATH="$GRADLE_HOME/bin:$PATH"

          "$GRADLE_HOME/bin/gradle" \
            --no-daemon \
            --no-configuration-cache \
            clean

      - name: Build signed release APK
        script: |
          set -e

          export GRADLE_HOME="$HOME/gradle-9.3.1"
          export PATH="$GRADLE_HOME/bin:$PATH"

          echo "Building RCS Vault with Gradle 9.3.1..."

          "$GRADLE_HOME/bin/gradle" \
            --no-daemon \
            --no-configuration-cache \
            assembleRelease

          echo "Searching APK..."

          find app/build/outputs -type f -name "*.apk" -print

      - name: Prepare final APK
        script: |
          set -e

          APK_DIR="app/build/outputs/apk/release"
          APK="$APK_DIR/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            find app/build/outputs -type f -print
            exit 1
          fi

          cp "$APK" "$APK_DIR/RCS-Vault.apk"

          echo "RCS-Vault.apk created:"
          ls -lh "$APK_DIR/RCS-Vault.apk"

    artifacts:
      - app/build/outputs/apk/release/RCS-Vault.apk
