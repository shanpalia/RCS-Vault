workflows:
  rcs_vault_android:
    name: RCS Vault Android APK
    max_build_duration: 60

    environment:
      android_signing:
        - paliaapk-release
      java: 17
      vars:
        PACKAGE_NAME: com.aistudio.rcsbackup.zqmvxp

    scripts:
      - name: Clean duplicate launcher resources
        script: |
          set -e
          find app/src -type f \( \
            -name 'ic_launcher.webp' -o \
            -name 'ic_launcher_round.webp' -o \
            -name 'ic_launcher_foreground.png' -o \
            -name 'ic_launcher_foreground.xml' \
          \) -print -delete
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Check project
        script: |
          set -e
          test -d app
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.properties
          echo 'Android project OK.'

      - name: Check signing
        script: |
          set -e
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          echo "Signing OK: $CM_KEY_ALIAS"

      - name: Install Gradle 9.3.1
        script: |
          set -e
          GRADLE_VERSION=9.3.1
          GRADLE_ZIP="$CM_BUILD_DIR/gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSL --retry 3 "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$GRADLE_ZIP"
          rm -rf "$CM_BUILD_DIR/gradle-${GRADLE_VERSION}"
          unzip -q "$GRADLE_ZIP" -d "$CM_BUILD_DIR"
          "$CM_BUILD_DIR/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Verify launcher resources
        script: |
          set -e
          if find app/src -type f \( -name 'ic_launcher.webp' -o -name 'ic_launcher_round.webp' -o -name 'ic_launcher_foreground.xml' -o -name 'ic_launcher_foreground.png' \) | grep -q .; then
            echo 'ERROR: conflicting launcher resources remain'
            find app/src -type f \( -name 'ic_launcher.webp' -o -name 'ic_launcher_round.webp' -o -name 'ic_launcher_foreground.xml' -o -name 'ic_launcher_foreground.png' \)
            exit 1
          fi
          echo 'Launcher resources OK.'

      - name: Build signed release APK
        script: |
          set -e
          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"
          GRADLE="$CM_BUILD_DIR/gradle-9.3.1/bin/gradle"
          "$GRADLE" --no-daemon --no-configuration-cache clean assembleRelease

      - name: Prepare RCS-Vault artifact
        script: |
          set -e
          APK_DIR="app/build/outputs/apk/release"
          test -f "$APK_DIR/app-release.apk"
          cp "$APK_DIR/app-release.apk" "$APK_DIR/RCS-Vault.apk"
          ls -lh "$APK_DIR/RCS-Vault.apk"

    artifacts:
      - app/build/outputs/apk/release/RCS-Vault.apk
