workflows:
  rcs_vault_android:
    name: RCS Vault Android APK
    max_build_duration: 60

    environment:
      android_signing:
        - paliaapk-release

      java: 17

      vars:
        PACKAGE_NAME: com.aistudio.rcsbackup.zqmvxp

    scripts:

      - name: Check Android project
        script: |
          set -e

          echo "Current directory:"
          pwd

          echo "Checking Android project..."

          test -d app
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          test -f build.gradle.kts

          echo "Android project OK."

      - name: Check signing
        script: |
          set -e

          echo "Checking Codemagic signing..."

          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"

          echo "Signing configuration detected."
          echo "Keystore: $CM_KEYSTORE_PATH"
          echo "Alias: $CM_KEY_ALIAS"

      - name: Prepare Gradle
        script: |
          set -e

          echo "Preparing Gradle 9.3.1..."

          sed -i.bak 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          ./gradlew --version

      - name: Clean build
        script: |
          set -e

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            clean

      - name: Build signed release APK
        script: |
          set -e

          echo "Building signed RCS Vault APK..."

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            assembleRelease

          echo "Build completed."

          echo "Searching for APK..."

          find app/build/outputs -type f -name "*.apk" -print

      - name: Verify APK
        script: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "Available output files:"
            find app/build/outputs -type f -print
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

      - name: Rename APK
        script: |
          set -e

          APK_DIR="app/build/outputs/apk/release"

          if [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" "$APK_DIR/RCS-Vault.apk"
          fi

          echo "Final APK files:"
          ls -lh "$APK_DIR"

    artifacts:
      - app/build/outputs/apk/release/*.apk

    publishing:
      scripts:
        - name: Build completed
          script: |
            echo "RCS Vault APK build completed successfully."
