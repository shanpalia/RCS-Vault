workflows:
  rcs_vault_android:
    name: RCS Vault Android APK
    max_build_duration: 60

    environment:
      android_signing:
        - paliaapk-release

      java: 17

      vars:
        PACKAGE_NAME: com.aistudio.rcsbackup.zqmvxp

    scripts:
      - name: Remove duplicate launcher resources
        script: |
          set -e
          echo "Removing all conflicting launcher resources..."
          find app/src -type f \( \
            -name 'ic_launcher.webp' -o \
            -name 'ic_launcher_round.webp' -o \
            -name 'ic_launcher_foreground.png' -o \
            -name 'ic_launcher_foreground.xml' \
          \) -print -delete

          echo "Remaining launcher resources:"
          find app/src/main/res -type f \( -name 'ic_launcher*' \) -print

      - name: Clean duplicate launcher resources
        script: |
          set -e
          find app/src/main/res -type f \( -name 'ic_launcher.webp' -o -name 'ic_launcher_foreground.xml' -o -name 'ic_launcher_foreground.png' \) -delete

      - name: Check project
        script: |
          set -e
          echo "Checking RCS Vault Android project..."
          test -d ./app
          test -f ./app/build.gradle.kts
          test -f ./settings.gradle.kts
          test -f ./build.gradle.kts
          test -f ./gradle/wrapper/gradle-wrapper.properties
          echo "Android project files found."

      - name: Check signing
        script: |
          set -e
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          echo "Release signing configured."
          echo "Alias: $CM_KEY_ALIAS"

      - name: Install Gradle 9.3.1
        script: |
          set -e
          GRADLE_VERSION=9.3.1
          GRADLE_ZIP="$CM_BUILD_DIR/gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_DIR="$CM_BUILD_DIR/gradle-${GRADLE_VERSION}"

          echo "Downloading Gradle ${GRADLE_VERSION}..."
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$GRADLE_ZIP"
          rm -rf "$GRADLE_DIR"
          unzip -q "$GRADLE_ZIP" -d "$CM_BUILD_DIR"

          export PATH="$GRADLE_DIR/bin:$PATH"
          gradle --version

          echo "Gradle 9.3.1 installed successfully."

      - name: Verify launcher resources
        script: |
          set -e
          if find app/src -type f \( -name 'ic_launcher.webp' -o -name 'ic_launcher_round.webp' \) | grep -q .; then
            echo "ERROR: Duplicate launcher WEBP resources still exist:"
            find app/src -type f \( -name 'ic_launcher.webp' -o -name 'ic_launcher_round.webp' \)
            exit 1
          fi
          echo "No duplicate launcher WEBP resources found."

      - name: Final launcher cleanup
        script: |
          set -e
          find app/src -type f \(             -name 'ic_launcher.webp' -o             -name 'ic_launcher_round.webp' -o             -name 'ic_launcher_foreground.xml' -o             -name 'ic_launcher_foreground.png'           \) -delete
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          echo "Final launcher resources:"
          find app/src/main/res -type f -name 'ic_launcher*' -print

      - name: Build signed release APK
        script: |
          set -e
          export PATH="$CM_BUILD_DIR/gradle-9.3.1/bin:$PATH"

          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"

          echo "Building signed RCS Vault APK..."
          gradle --no-daemon --no-configuration-cache clean assembleRelease

          echo "Searching generated APK..."
          find app/build/outputs -type f -name "*.apk" -print

          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: app-release.apk was not generated."
            find app/build/outputs -type f -print
            exit 1
          fi

          cp "$APK" "app/build/outputs/apk/release/RCS-Vault.apk"

          echo "Final artifact:"
          ls -lh "app/build/outputs/apk/release/RCS-Vault.apk"

    artifacts:
      - app/build/outputs/apk/release/RCS-Vault.apk
