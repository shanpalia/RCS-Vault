workflows:
  rcs_vault_android:
    name: RCS Vault Android APK
    max_build_duration: 60

    environment:
      android_signing:
        - paliaapk-release

      java: 17

      vars:
        PACKAGE_NAME: com.aistudio.rcsbackup.zqmvxp

    scripts:
      - name: Check project
        script: |
          set -e
          test -f gradlew
          test -f app/build.gradle.kts
          chmod +x gradlew

      - name: Check signing
        script: |
          set -e
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          echo "Keystore configured successfully."

      - name: Build signed release APK
        script: |
          set -e
          ./gradlew --no-daemon clean assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/mapping.txt
